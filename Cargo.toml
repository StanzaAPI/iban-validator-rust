[package]
name = "stanzaapi-iban-validator"
version = "1.0.0"
edition = "2021"
authors = ["Stanza"]
description = "Official high-speed Rust client for Global IBAN, BIC/SWIFT & Bank Routing Validator API"
license = "MIT"
readme = "README.md"
homepage = "https://stanzaapi.com/tools/iban-validator"
repository = "https://github.com/stanzaapi/iban-validator-rust"
keywords = ["iban","bic-swift","sepa","iso-13616","mod-97"]
categories = ["web-programming::http-client", "development-tools::ffi"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"], optional = true }
